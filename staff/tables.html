<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor / Tables - Pelma's Cuisine Staff Portal</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Brand & Dashboard Styles -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/staff.css">
</head>
<body class="restaurant-os-body">

    <!-- App Container -->
    <div class="app-layout">
        
        <!-- Left Sidebar Navigation for Staff Portal -->
        <aside class="os-sidebar">
            <div class="sidebar-brand">
                <h2>Pelma's Cuisine</h2>
                <span class="user-role-badge">Staff Portal</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Live Dashboard</a>
                <a href="tables.html" class="nav-item active"><i class="fa-solid fa-chair"></i> Floor / Tables</a>
                <a href="takeout.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i> Takeout / Delivery</a>
                <a href="receipts.html" class="nav-item"><i class="fa-solid fa-receipt"></i> Shift Receipts</a>
                <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Portal Settings</a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="handleStaffLogout()" class="btn-shift-report"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="os-main">
            <!-- Top Navbar Header -->
            <header class="os-topbar">
                <div class="os-brand-title">
                    <h1>Floor & Tables <span class="os-version-tag">Seating Layout</span></h1>
                </div>

                <!-- Floor Zone Filters -->
                <div class="station-filters">
                    <button class="filter-btn active" onclick="filterTableZone('ALL', event)">ALL TABLES</button>
                    <button class="filter-btn" onclick="filterTableZone('Main Hall', event)">Main Hall</button>
                    <button class="filter-btn" onclick="filterTableZone('Terrace', event)">Terrace</button>
                </div>

                <div class="os-topbar-right">
                    <button class="icon-btn"><i class="fa-solid fa-bell"></i><span class="notification-dot"></span></button>
                    <button class="icon-btn"><i class="fa-solid fa-circle-question"></i></button>
                    <div class="user-avatar-badge"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <!-- Metrics Summary Cards -->
            <section class="os-metrics-grid">
                <div class="os-metric-card">
                    <span class="metric-label">TOTAL TABLES</span>
                    <h3 id="count-total-tables">8</h3>
                </div>
                <div class="os-metric-card">
                    <span class="metric-label">OCCUPIED SEATS</span>
                    <h3 id="count-occupied">0</h3>
                </div>
                <div class="os-metric-card">
                    <span class="metric-label">AVAILABLE</span>
                    <h3 id="count-available">8</h3>
                </div>
                <div class="os-metric-card alert-card">
                    <span class="metric-label">FLOOR STATUS</span>
                    <h3 class="text-accent">Active</h3>
                </div>
            </section>

            <!-- Dynamic Tables Grid -->
            <section class="os-tickets-section">
                <div id="tables-grid" class="os-tickets-grid">
                    <!-- Tables dynamically injected via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Script Logic -->
    <script src="../js/tables.js"></script>
    <script src="../js/portal-config.js"></script>
</body>
</html>
