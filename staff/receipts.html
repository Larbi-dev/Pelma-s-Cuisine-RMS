<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Receipts - Pelma's Cuisine</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Brand & Dashboard Styles -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/staff.css">
    <style>
        /* Interactive & Animation Extensions for Shift Receipts */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .receipts-container {
            animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .receipt-card {
            transition: all 0.25s ease;
        }

        .receipt-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.1);
        }

        .interactive-tab {
            position: relative;
            overflow: hidden;
        }

        .interactive-tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: #38bdf8;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .interactive-tab.active::after, .interactive-tab:hover::after {
            width: 100%;
        }

        /* Modal Overlay Animation */
        .receipt-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .receipt-modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .receipt-modal-content {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            transform: translateY(20px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .receipt-modal-backdrop.open .receipt-modal-content {
            transform: translateY(0);
        }

        /* Pulse animation for live sync */
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .live-pulse {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="restaurant-os-body">

    <!-- App Container -->
    <div class="app-layout">
        
        <!-- Left Sidebar Navigation -->
        <aside class="os-sidebar">
            <div class="sidebar-brand">
                <span class="user-role-badge">Staff Portal</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Live Dashboard</a>
                <a href="tables.html" class="nav-item"><i class="fa-solid fa-chair"></i> Floor / Tables</a>
                <a href="takeout.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i> Takeout / Delivery</a>
                <a href="receipts.html" class="nav-item active"><i class="fa-solid fa-receipt"></i> Shift Receipts</a>
                <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Portal Settings</a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="handleStaffLogout()" class="btn-shift-report"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="os-main">
            <!-- Top Navbar Header -->
            <header class="os-topbar">
                <div class="os-brand-title">
                    <h1>Shift Receipts <span class="os-version-tag live-pulse">Ledger Active</span></h1>
                </div>

                <!-- Receipt View Filter Tabs -->
                <div class="station-filters">
                    <button class="filter-btn active interactive-tab" onclick="filterReceipts('ALL')">ALL TRANSACTIONS</button>
                    <button class="filter-btn interactive-tab" onclick="filterReceipts('Dine-In')">Dine-In</button>
                    <button class="filter-btn interactive-tab" onclick="filterReceipts('Takeout')">Takeout</button>
                    <button class="filter-btn interactive-tab" onclick="filterReceipts('Delivery')">Delivery</button>
                </div>

                <div class="os-topbar-right">
                    <button class="icon-btn" title="Notifications"><i class="fa-solid fa-bell"></i><span class="notification-dot"></span></button>
                    <button class="icon-btn" title="Help"><i class="fa-solid fa-circle-question"></i></button>
                    <div class="user-avatar-badge"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <!-- Financial Metrics Summary Cards -->
            <section class="os-metrics-grid">
                <div class="os-metric-card">
                    <span class="metric-label">TOTAL SHIFT REVENUE</span>
                    <h3 id="metric-revenue" class="text-accent">₵0.00</h3>
                </div>
                <div class="os-metric-card">
                    <span class="metric-label">CASH COLLECTED</span>
                    <h3 id="metric-cash">₵0.00</h3>
                </div>
                <div class="os-metric-card">
                    <span class="metric-label">DIGITAL / MOMO</span>
                    <h3 id="metric-digital" class="text-accent">₵0.00</h3>
                </div>
                <div class="os-metric-card alert-card">
                    <span class="metric-label">COMPLETED ORDERS</span>
                    <h3 id="metric-count">0</h3>
                </div>
            </section>

            <!-- Receipts Content Area -->
            <section class="os-tickets-section receipts-container">
                <!-- Action Control Bar -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="receipt-search" placeholder="Search receipt ID or server..." style="background: #111827; border: 1px solid #1e293b; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; width: 240px; outline: none;" onkeyup="searchReceipts()">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="printShiftReport()" style="background-color: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: filter 0.2s;"><i class="fa-solid fa-print"></i> Print Report</button>
                        <button onclick="reconcileDrawer()" style="background-color: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;"><i class="fa-solid fa-vault"></i> Reconcile Drawer</button>
                    </div>
                </div>

                <!-- Transaction Cards Grid -->
                <div id="receipts-grid" class="os-tickets-grid">
                    <!-- Dynamically populated from localStorage -->
                </div>
            </section>
        </main>
    </div>

    <!-- Receipt Details Modal -->
    <div id="receiptModal" class="receipt-modal-backdrop" onclick="closeReceiptModal(event)">
        <div class="receipt-modal-content" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 15px;">
                <h3 id="modal-title" style="margin: 0; color: #fff; font-size: 1.1rem;">Receipt Breakdown</h3>
                <button onclick="closeReceiptModalDirect()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-body" style="font-size: 0.9rem; color: #e2e8f0; display: flex; flex-direction: column; gap: 10px;">
                <!-- Populated dynamically -->
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="printSingleReceipt(currentModalId)" class="os-btn-action os-btn-start"><i class="fa-solid fa-print"></i> Print Official Receipt</button>
                <button onclick="closeReceiptModalDirect()" style="background: #1e293b; color: #fff; border: none; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; flex: 1;">Close</button>
            </div>
        </div>
    </div>

    <!-- Script Logic for Interactions, LocalStorage Sync & Animations -->
    <script>
        let currentModalId = '';
        let allReceipts = [];

        // Load receipts from localStorage on page startup targeting allOrders first
        document.addEventListener('DOMContentLoaded', () => {
            loadAndRenderReceipts();
        });

        function loadAndRenderReceipts() {
            const storedData = localStorage.getItem('allOrders') || 
                               localStorage.getItem('shiftOrders') || 
                               localStorage.getItem('staffShiftOrders') || '[]';
            
            try {
                allReceipts = JSON.parse(storedData);
            } catch (e) {
                console.error("Error parsing local storage receipts:", e);
                allReceipts = [];
            }

            // Fallback mock receipt only if storage keys are completely empty
            if (!Array.isArray(allReceipts) || allReceipts.length === 0) {
                allReceipts = [
                    {
                        id: "REC-1001",
                        type: "Dine-In",
                        server: "Frank",
                        table: "Table #01",
                        time: "11:32 AM",
                        payment: "MoMo / Digital",
                        total: "14.25",
                        items: [{ name: "BBQ Burger", qty: 1, price: "11.00" }, { name: "Onion Rings", qty: 1, price: "3.25" }]
                    }
                ];
            }

            renderReceiptCards(allReceipts);
            updateMetrics(allReceipts);
        }

        function renderReceiptCards(receipts) {
            const grid = document.getElementById('receipts-grid');
            grid.innerHTML = '';

            receipts.forEach(rec => {
                const itemsHtml = (rec.items || []).map(item => `<li><span>${item.qty || item.quantity || 1}x ${item.name || item.title || 'Item'}</span> <strong>₵${item.price || item.amount || '0.00'}</strong></li>`).join('');
                const itemsStringParam = (rec.items || []).map(i => `${i.qty || i.quantity || 1}x ${i.name || i.title || 'Item'} (₵${i.price || i.amount || '0.00'})`).join(', ');
                const serverName = rec.server || rec.staff || rec.cashier || 'Staff';
                const serverDisplay = serverName + (rec.table ? ` | ${rec.table}` : '');
                const orderType = rec.type || rec.orderType || 'Dine-In';
                const orderId = rec.id || rec.orderId || rec._id || 'REC-XXX';
                const orderTotal = rec.total || rec.amount || '0.00';
                const orderPayment = rec.payment || rec.paymentMethod || 'MoMo / Digital';

                const cardHtml = `
                    <div class="os-ticket-card receipt-card" data-category="${orderType}" data-id="${orderId}" data-server="${serverName}">
                        <div class="os-ticket-header">
                            <div>
                                <h4>${orderId} <span style="font-size: 0.75rem; color: #38bdf8; margin-left: 6px;">[${orderType}]</span></h4>
                                <span style="font-size: 0.75rem; color: #94a3b8;">Server: ${serverDisplay}</span>
                            </div>
                            <div class="os-ticket-timer-box">
                                <span class="ticket-time">${rec.time || rec.timestamp || 'Just now'}</span>
                                <span class="status-tag cooking" style="background-color: #10b981;">PAID</span>
                            </div>
                        </div>
                        <ul class="os-ticket-items">
                            ${itemsHtml}
                        </ul>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.9rem;">
                            <span style="color: #94a3b8;">Payment: <strong style="color: #f3f4f6;">${orderPayment}</strong></span>
                            <span style="font-size: 1.1rem; font-weight: 700; color: #38bdf8;">Total: ₵${orderTotal}</span>
                        </div>
                        <div class="os-ticket-actions">
                            <button class="os-btn-action os-btn-start" onclick="openReceiptModal('${orderId}', '${orderType}', '${serverDisplay}', '${rec.time || rec.timestamp || 'N/A'}', '${orderPayment}', '${orderTotal}', '${itemsStringParam}')"><i class="fa-solid fa-eye"></i> View Details</button>
                            <button class="os-btn-action os-btn-ready" onclick="printSingleReceipt('${orderId}')"><i class="fa-solid fa-print"></i> Reprint</button>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function updateMetrics(receipts) {
            let totalRev = 0;
            let cashTotal = 0;
            let digitalTotal = 0;

            receipts.forEach(rec => {
                const amt = parseFloat(rec.total || rec.amount) || 0;
                totalRev += amt;
                const paymentMethod = (rec.payment || rec.paymentMethod || '').toLowerCase();
                if (paymentMethod.includes('cash')) {
                    cashTotal += amt;
                } else {
                    digitalTotal += amt;
                }
            });

            document.getElementById('metric-revenue').innerText = `₵${totalRev.toFixed(2)}`;
            document.getElementById('metric-cash').innerText = `₵${cashTotal.toFixed(2)}`;
            document.getElementById('metric-digital').innerText = `₵${digitalTotal.toFixed(2)}`;
            document.getElementById('metric-count').innerText = receipts.length;
        }

        function filterReceipts(category) {
            const buttons = document.querySelectorAll('.station-filters .filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.receipt-card');
            cards.forEach(card => {
                const cardCat = card.getAttribute('data-category');
                if (category === 'ALL' || cardCat === category) {
                    card.style.display = 'flex';
                    card.style.animation = 'fadeInScale 0.3s ease forwards';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function searchReceipts() {
            const query = document.getElementById('receipt-search').value.toLowerCase();
            const cards = document.querySelectorAll('.receipt-card');
            cards.forEach(card => {
                const id = card.getAttribute('data-id').toLowerCase();
                const server = card.getAttribute('data-server').toLowerCase();
                if (id.includes(query) || server.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openReceiptModal(id, type, server, time, payment, total, items) {
            currentModalId = id;
            document.getElementById('modal-title').innerText = `Transaction Details: ${id}`;
            document.getElementById('modal-body').innerHTML = `
                <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed #1e293b; padding-bottom: 8px;">
                    <span style="color: #94a3b8;">Order Type:</span>
                    <strong>${type}</strong>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed #1e293b; padding-bottom: 8px;">
                    <span style="color: #94a3b8;">Staff / Server:</span>
                    <strong>${server}</strong>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed #1e293b; padding-bottom: 8px;">
                    <span style="color: #94a3b8;">Timestamp:</span>
                    <strong>${time}</strong>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed #1e293b; padding-bottom: 8px;">
                    <span style="color: #94a3b8;">Payment Method:</span>
                    <strong style="color: #38bdf8;">${payment}</strong>
                </div>
                <div style="margin-top: 5px;">
                    <span style="color: #94a3b8; display: block; margin-bottom: 5px;">Ordered Items:</span>
                    <div style="background: #0b0f19; padding: 10px; border-radius: 6px; border: 1px solid #1e293b;">${items}</div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 1.1rem; font-weight: 700;">
                    <span>Total Amount:</span>
                    <span style="color: #38bdf8;">₵${total}</span>
                </div>
            `;
            document.getElementById('receiptModal').classList.add('open');
        }

        function closeReceiptModal(event) {
            document.getElementById('receiptModal').classList.remove('open');
        }

        function closeReceiptModalDirect() {
            document.getElementById('receiptModal').classList.remove('open');
        }

        function printShiftReport() {
            alert("Generating official Shift Financial Report PDF...");
        }

        function reconcileDrawer() {
            alert("Initiating cash drawer reconciliation wizard...");
        }

        function printSingleReceipt(id) {
            alert(`Sending reprint command for receipt ${id} to kitchen thermal printer...`);
        }

        function handleStaffLogout() {
            if(confirm('Are you sure you want to log out of the staff portal?')) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
    <script src="../js/portal-config.js"></script>
</body>
</html>
